server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/laravel-app/public;

    # 1. Проксируем HMR и служебные скрипты Vite
    location /@vite/ {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host localhost; 
    }

    # 2. Проксируем физические папки исходников стилей Tailwind v4
    location /resources/ {
        proxy_pass http://vite:5173;
        proxy_set_header Host localhost;
    }

    # 3. Стандартный роутинг для красивых URL Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. Передача PHP-запросов в контейнер Laravel
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
